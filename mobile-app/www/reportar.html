<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportar actividad | ColegioLibre</title><link rel="stylesheet" href="/styles.css"><style>body{font-family:Inter,Arial,sans-serif;background:#f5f8fc;color:#102d52}main{max-width:570px;margin:8vh auto;padding:26px;background:white;border:1px solid #dae4f0;border-radius:18px}label{display:block;font-weight:700;margin:18px 0 6px}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #bacbdf;border-radius:10px;box-sizing:border-box}button{background:#116bd0;color:white;border:0;border-radius:10px;padding:13px 20px;margin-top:20px;cursor:pointer}p{line-height:1.5}#status{min-height:24px}</style></head><body><main><a href="/">← ColegioLibre</a><h1>Reportar actividad sospechosa</h1><p>Contanos qué pasó. No compartas contraseñas, DNI, selfies ni información bancaria. Si estás en peligro inmediato, pedí ayuda a una persona adulta de confianza.</p><form id="report"><label for="type">¿Qué querés reportar?</label><select id="type" required><option value="listing">Publicación</option><option value="user">Usuario</option><option value="message">Mensaje</option></select><label for="target">ID o enlace de referencia</label><input id="target" required maxlength="160" placeholder="ID de publicación, usuario o mensaje"><label for="reason">Motivo</label><select id="reason" required><option value="fraud">Posible estafa</option><option value="external_payment">Solicitud de pago externo</option><option value="harassment">Acoso</option><option value="counterfeit">Producto falsificado</option><option value="other">Otro</option></select><label for="details">Descripción (opcional)</label><textarea id="details" maxlength="2000" rows="5"></textarea><button type="submit">Enviar reporte</button><p id="status" role="status" aria-live="polite"></p></form></main><script src="/vendor/supabase.js"></script><script src="/supabase.js"></script><script>
document.getElementById('report').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');const button=e.target.querySelector('button');button.disabled=true;try{const client=window.colegioLibreSupabase;if(!client)throw Error('No se pudo conectar con el servicio.');const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw Error('Iniciá sesión para enviar el reporte.');const target=document.getElementById('target').value.trim();if(!target||target.length>160)throw Error('Ingresá una referencia válida.');const {error}=await client.from('trust_reports').insert({reporter_id:user.id,target_type:document.getElementById('type').value,target_id:target,reason:document.getElementById('reason').value,details:document.getElementById('details').value.trim()||null});if(error)throw Error('No pudimos enviar el reporte. Intentá de nuevo.');status.textContent='Reporte recibido. Lo revisaremos.';e.target.reset();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>
