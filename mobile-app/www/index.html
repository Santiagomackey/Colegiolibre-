<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0B2E6B" />
    <title>ColegioLibre</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f9fc;
        color: #0b2e6b;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      main { width: min(420px, 100%); }
      img { width: 92px; border-radius: 24px; }
      h1 { margin: 18px 0 8px; }
      p { color: #64728a; line-height: 1.55; }
      a {
        display: inline-grid;
        place-items: center;
        min-height: 48px;
        margin-top: 12px;
        padding: 0 22px;
        border-radius: 14px;
        background: #0b2e6b;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ColegioLibre</h1>
      <p>Necesitás conexión para cargar el marketplace por primera vez.</p>
      <a href="https://colegiolibre.vercel.app">Volver a intentar</a>
    </main>
  </body>
</html>
