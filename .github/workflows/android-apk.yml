name: Crear APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'images/**'
      - 'vendor/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK de prueba actualizado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Instalar plataforma Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Instalar dependencias fijadas
        run: npm --prefix mobile-app ci
      - name: Sincronizar y compilar sin reemplazar el proyecto nativo
        run: |
          chmod +x mobile-app/android/gradlew
          npm run android:apk
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ColegioLibre-Android-debug
          path: mobile-app/artifacts/*-debug.apk
          if-no-files-found: error
          retention-days: 14
