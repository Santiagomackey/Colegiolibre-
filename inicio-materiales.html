<!doctype html>
<html lang="es" data-theme="light" data-language="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pedí los materiales que necesitás para el cole y explorá las publicaciones de ColeGo.">
  <title>ColeGo</title>
  <link rel="stylesheet" href="/site-header.css?v=smooth-nav-1">
  <style>html,html[data-theme] body{margin:0;background:#fff}.colego-publish-floating{display:none!important}
html body .cl-site-header .cl-site-top{height:62px;min-height:62px;padding-block:3px}
.cl-site-header .cl-site-brand{height:53px}
.cl-site-header .cl-site-brand img{width:auto;max-width:100%;height:100%;object-fit:contain;transform:none}
html body .cl-site-header .cl-site-search{height:40px}
html body .cl-site-header .cl-site-search button{width:32px;height:32px;flex-basis:32px}
@media(max-width:700px){
  html body .cl-site-header .cl-site-top{height:94px;min-height:0;padding-bottom:7px}
  .cl-site-header .cl-site-brand{height:43px}
  html body .cl-site-header .cl-site-search{height:36px!important}
}

html body .cl-site-header.cl-header-compact .cl-site-top{min-height:54px}
</style>
  <link rel="stylesheet" href="/inicio-materiales.css?v=presupuesto-1">
</head>
<body>
<header class="cl-site-header" data-no-translate>
 <div class="cl-site-top">
  <a class="cl-site-brand" href="/" data-site-label="home" aria-label="Inicio"><img src="/images/colego-header-palette.webp" alt="ColeGo" fetchpriority="high"></a>
  <form class="cl-site-search" id="search-form-desktop" action="/explorar" method="get" role="search">
   <label class="cl-site-sr" for="desktop-search" data-site-text="searchLabel">Buscar material escolar</label>
   <input id="desktop-search" name="q" type="search" autocomplete="off" placeholder="¿Qué material estás buscando?">
   <button type="submit" data-site-label="searchLabel" aria-label="Buscar material escolar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
  </form>
  <div class="cl-site-actions header-actions" aria-label="Acciones de tu cuenta" data-site-label="accountActions">
   <a class="cl-site-action cl-site-desktop-action" id="header-messages-link" href="/mensajes" data-requires-auth><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4Z"/><path d="M8 8h8M8 12h5"/></svg><span data-site-text="messages">Mensajes</span></a>
   <a class="cl-site-action cl-site-desktop-action" id="header-favorites-link" href="/favoritos" data-requires-auth><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span data-site-text="favorites">Favoritos</span></a>
   <a class="cl-site-action cl-site-account" id="accountButton" href="/login"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span id="accountText">Iniciar sesión</span></a>
   <details class="cl-site-account-menu"><summary data-site-label="accountMenu" aria-label="Abrir menú de cuenta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></summary><nav class="cl-site-menu-panel" aria-label="Mi cuenta" data-site-label="accountMenu">
    <a href="/perfil" data-site-text="profile">Mi perfil</a><a href="/perfil?view=settings" data-site-text="settings">Configuración</a><a href="/pedidos" data-site-text="orders">Mis compras y ventas</a><a href="/mensajes" data-site-text="messages">Mensajes</a><a href="/favoritos" data-site-text="favorites">Favoritos</a><button type="button" data-site-logout hidden data-site-text="logout">Cerrar sesión</button>
   </nav></details>
  </div>
 </div>
</header>
<main class="materials-home">
 <section class="materials-hero" aria-labelledby="materials-title">
  <h1 id="materials-title">¿Qué necesitás para el cole?</h1>
  <p>Pedilo y te avisamos cuando aparezca.</p>
  <form class="materials-composer" action="/busco#crear-pedido" method="get">
   <label class="cl-site-sr" for="material-title">Material que necesitás</label>
   <input id="material-title" name="title" placeholder="Ej. Libro de Matemática" required minlength="3" maxlength="120">
   <label class="cl-site-sr" for="material-budget">Presupuesto máximo en pesos (opcional)</label>
   <input id="material-budget" name="max_price" type="number" inputmode="numeric" min="0" max="100000000" step="1" placeholder="Presupuesto ($)" list="material-budget-options">
   <datalist id="material-budget-options">
    <option value="8000"></option>
    <option value="10000"></option>
    <option value="15000"></option>
    <option value="30000"></option>
   </datalist>
   <fieldset class="materials-scopes">
    <legend class="cl-site-sr">Dónde buscar</legend>
    <label><input type="checkbox" name="scope" value="school"> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5-10-5Zm4 2v6c4 3 8 3 12 0v-6m4-2v7"/></svg>Mi colegio</label>
    <label><input type="checkbox" name="scope" value="zone" checked> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Mi zona</label>
   </fieldset>
   <button class="materials-submit" type="submit">Pedir material</button>
  </form>
 </section>
 <div class="materials-panels">
  <section class="materials-card" aria-labelledby="published-title">
   <h2 id="published-title">Explorá lo que ya está publicado</h2>
   <div id="materials-products" aria-live="polite">Cargando publicaciones…</div>
   <a class="materials-link" href="/explorar">Ver catálogo</a>
  </section>
  <section class="materials-card materials-card--requests" aria-labelledby="requests-title">
   <h2 id="requests-title">Mis pedidos</h2>
   <div id="materials-requests" aria-live="polite">Cargando pedidos…</div>
   <a class="materials-link" href="/colegio">Mi colegio</a>
  </section>
 </div>
</main>

<script src="/vendor/supabase.js?v=20261109-release25" defer></script>
<script src="/supabase.js?v=20261110-recovery31" defer></script>
<script src="/site-header.js?v=palette-logo-1" defer></script>
<script src="/inicio-materiales.js" defer></script>
</body>
</html>
